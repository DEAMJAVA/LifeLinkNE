{% extends "base.html" %}
{% block title %}Log in — LifeLink NE{% endblock %}
{% block body %}
<div class="landing">
  <form class="auth-card" method="post" action="{{ url_for('auth.login') }}">
    <h1 class="brand small">LIFE<span>LINK</span> NE</h1>
    <label>Email
      <input type="email" name="email" value="{{ email }}" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button class="btn btn-primary full" type="submit">Log in</button>
    <p class="auth-switch">No account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
  </form>
</div>
{% endblock %}
